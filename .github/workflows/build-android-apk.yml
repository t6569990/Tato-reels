name: Build Tato Reels Creator APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/pc.html"
      - "public/assets/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/prepare-android.mjs"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install dependencies
        run: npm install

      - name: Prepare mobile web bundle
        run: npm run build:android

      - name: Generate Android project
        run: npx cap add android

      - name: Generate native Android launcher icons
        run: node scripts/install-android-icon.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: tato-reels-creator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
