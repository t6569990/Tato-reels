name: Build Tato Reels Creator APK #55

on:
  workflow_dispatch:
  push:
    branches:
      - "build/apk-55-from-current-web"
    paths:
      - "public/mobile.html"
      - "public/assets/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/prepare-android.mjs"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current web source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install dependencies
        run: npm install

      - name: Prepare fresh web bundle from public/mobile.html
        run: npm run build:android

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK and create local test signing key
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease

      - name: Create local Android test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign release APK for direct device installation
        working-directory: android
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          test -f "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          ls -lh "$SIGNED"

      - name: Upload Tato Reels Creator APK #55
        uses: actions/upload-artifact@v4
        with:
          name: tato-reels-creator-55-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
